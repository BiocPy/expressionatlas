version: 0.2

# AWS CodeBuild buildspec for Expression Atlas RData Converter
# Builds Docker image and pushes to ECR, then deploys to App Runner or ECS

env:
  variables:
    # These can be overridden in CodeBuild project settings
    AWS_DEFAULT_REGION: us-east-1
    IMAGE_REPO_NAME: atlas-converter
    IMAGE_TAG: latest
  parameter-store:
    # Optional: pull sensitive values from SSM Parameter Store
    # S3_BUCKET_NAME: /atlas-converter/s3-bucket-name

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Building image $REPOSITORY_URI:$IMAGE_TAG"

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - cd cloud_converter
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo Writing image definitions file...
      - printf '[{"name":"atlas-converter","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - cloud_converter/imagedefinitions.json
    - cloud_converter/apprunner.yaml
  discard-paths: yes

cache:
  paths:
    - '/root/.cache/pip/**/*'
